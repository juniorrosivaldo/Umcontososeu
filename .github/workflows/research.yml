name: Public research agents
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: research-agents
  cancel-in-progress: false
jobs:
  research:
    if: vars.ENABLE_AGENT_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_MODE: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      WORKSPACE_ID: ${{ vars.WORKSPACE_ID }}
      AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --require-hashes -r backend/requirements.txt
      - run: python -m backend.app.scheduler
